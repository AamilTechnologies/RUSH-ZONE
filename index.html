<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rush Zone</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }body{
  overflow:hidden;
  background:#050816;
  color:white;
}

canvas{
  display:block;
  background:
  linear-gradient(
  180deg,
  #08111f,
  #050816
  );
}

.ui{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
}

.logo{
  font-size:38px;
  font-weight:800;
  color:#00d4ff;
  text-shadow:0 0 20px #00d4ff;
  margin-bottom:10px;
}

.score{
  font-size:22px;
  font-weight:600;
}

.start-screen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  z-index:20;
}

.start-screen h1{
  font-size:64px;
  color:#00d4ff;
  text-shadow:0 0 25px #00d4ff;
  margin-bottom:20px;
}

.start-screen p{
  font-size:18px;
  margin-bottom:30px;
  opacity:0.8;
}

.start-btn{
  width:220px;
  height:65px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed);
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,212,255,0.4);
  transition:0.2s;
}

.start-btn:hover{
  transform:scale(1.05);
}

.game-over{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.75);
  z-index:30;
}

.game-over h2{
  font-size:52px;
  color:#ff4d6d;
  margin-bottom:20px;
}

.restart-btn{
  width:220px;
  height:60px;
  border:none;
  border-radius:18px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed);
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

  </style>
</head>
<body><div class="ui">
  <div class="logo">Rush Zone</div>
  <div class="score">Score: <span id="score">0</span></div>
</div><div class="start-screen" id="startScreen">
  <h1>Rush Zone</h1>
  <p>Tap SPACE or Jump to survive.</p>
  <button class="start-btn" id="startBtn">Start Game</button>
</div><div class="game-over" id="gameOver">
  <h2>Game Over</h2>
  <button class="restart-btn" id="restartBtn">Restart</button>
</div><canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = {
  x:120,
  y:canvas.height - 170,
  width:60,
  height:60,
  color:'#00d4ff',
  velocityY:0,
  gravity:1,
  jump:-20,
  grounded:true
};

let obstacles = [];
let score = 0;
let speed = 8;
let gameRunning = false;

function createObstacle(){
  obstacles.push({
    x:canvas.width,
    y:canvas.height - 150,
    width:50,
    height:50,
    color:'#ff4d6d'
  });
}

setInterval(()=>{
  if(gameRunning){
    createObstacle();
  }
},1500);

function drawPlayer(){
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00d4ff';
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x,player.y,player.width,player.height);
}

function drawObstacles(){
  obstacles.forEach((obs,index)=>{

    obs.x -= speed;

    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff4d6d';
    ctx.fillStyle = obs.color;
    ctx.fillRect(obs.x,obs.y,obs.width,obs.height);

    if(obs.x + obs.width < 0){
      obstacles.splice(index,1);
      score++;
      document.getElementById('score').innerText = score;
    }

    if(
      player.x < obs.x + obs.width &&
      player.x + player.width > obs.x &&
      player.y < obs.y + obs.height &&
      player.y + player.height > obs.y
    ){
      gameOver();
    }

  });
}

function update(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = '#111827';
  ctx.fillRect(0,canvas.height-90,canvas.width,90);

  player.velocityY += player.gravity;
  player.y += player.velocityY;

  if(player.y >= canvas.height - 170){
    player.y = canvas.height - 170;
    player.grounded = true;
  }

  drawPlayer();
  drawObstacles();

  if(gameRunning){
    requestAnimationFrame(update);
  }
}

function jump(){
  if(player.grounded){
    player.velocityY = player.jump;
    player.grounded = false;
  }
}

window.addEventListener('keydown',(e)=>{
  if(e.code === 'Space'){
    jump();
  }
});

window.addEventListener('touchstart',()=>{
  jump();
});

function startGame(){
  obstacles = [];
  score = 0;
  document.getElementById('score').innerText = 0;
  gameRunning = true;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  update();
}

function gameOver(){
  gameRunning = false;
  document.getElementById('gameOver').style.display = 'flex';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

window.addEventListener('resize',()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script></body>
</html>
