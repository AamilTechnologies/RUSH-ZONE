<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rush Zone</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
overflow:hidden;
background:#050816;
color:white;
}

/* CANVAS */

canvas{
display:block;
background:
linear-gradient(
180deg,
#08111f,
#050816
);
}

/* UI */

.ui{
position:fixed;
top:20px;
left:20px;
z-index:10;
}

.logo{

font-size:40px;
font-weight:800;

color:#00d4ff;

text-shadow:
0 0 20px #00d4ff;

margin-bottom:10px;

}

.score{

font-size:24px;
font-weight:600;

}

/* START */

.start-screen{

position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:
rgba(0,0,0,0.7);

backdrop-filter:blur(8px);

z-index:20;

}

.start-screen h1{

font-size:72px;

color:#00d4ff;

text-shadow:
0 0 30px #00d4ff;

margin-bottom:20px;

}

.start-screen p{

font-size:18px;

opacity:0.8;

margin-bottom:30px;

}

.start-btn,
.restart-btn{

width:240px;
height:65px;

border:none;

border-radius:22px;

background:
linear-gradient(
90deg,
#00d4ff,
#7c3aed
);

color:white;

font-size:20px;
font-weight:700;

cursor:pointer;

box-shadow:
0 0 25px rgba(0,212,255,0.4);

}

/* GAME OVER */

.game-over{

position:fixed;
inset:0;

display:none;
justify-content:center;
align-items:center;
flex-direction:column;

background:
rgba(0,0,0,0.75);

z-index:30;

}

.game-over h2{

font-size:58px;

color:#ff004c;

margin-bottom:20px;

}

/* MOBILE */

@media(max-width:700px){

.logo{
font-size:30px;
}

.score{
font-size:18px;
}

.start-screen h1{
font-size:50px;
}

}

</style>

</head>

<body>

<div class="ui">

<div class="logo">
Rush Zone
</div>

<div class="score">
Score:
<span id="score">0</span>
</div>

</div>

<!-- START -->

<div class="start-screen"
id="startScreen">

<h1>Rush Zone</h1>

<p>Tap SPACE or Touch to Jump</p>

<button class="start-btn"
id="startBtn">

Start Game

</button>

</div>

<!-- GAME OVER -->

<div class="game-over"
id="gameOver">

<h2>Game Over</h2>

<button class="restart-btn"
id="restartBtn">

Restart

</button>

</div>

<!-- CANVAS -->

<canvas id="gameCanvas"></canvas>
