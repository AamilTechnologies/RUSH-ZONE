<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rush Zone</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
overflow:hidden;
background:#050816;
color:white;
}

/* CANVAS */

canvas{
display:block;
background:
linear-gradient(
180deg,
#08111f,
#050816
);
}

/* UI */

.ui{
position:fixed;
top:20px;
left:20px;
z-index:10;
}

.logo{

font-size:40px;
font-weight:800;

color:#00d4ff;

text-shadow:
0 0 20px #00d4ff;

margin-bottom:10px;

}

.score{

font-size:24px;
font-weight:600;

}

/* START */

.start-screen{

position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:
rgba(0,0,0,0.7);

backdrop-filter:blur(8px);

z-index:20;

}

.start-screen h1{

font-size:72px;

color:#00d4ff;

text-shadow:
0 0 30px #00d4ff;

margin-bottom:20px;

}

.start-screen p{

font-size:18px;

opacity:0.8;

margin-bottom:30px;

}

.start-btn,
.restart-btn{

width:240px;
height:65px;

border:none;

border-radius:22px;

background:
linear-gradient(
90deg,
#00d4ff,
#7c3aed
);

color:white;

font-size:20px;
font-weight:700;

cursor:pointer;

box-shadow:
0 0 25px rgba(0,212,255,0.4);

}

/* GAME OVER */

.game-over{

position:fixed;
inset:0;

display:none;
justify-content:center;
align-items:center;
flex-direction:column;

background:
rgba(0,0,0,0.75);

z-index:30;

}

.game-over h2{

font-size:58px;

color:#ff004c;

margin-bottom:20px;

}

/* MOBILE */

@media(max-width:700px){

.logo{
font-size:30px;
}

.score{
font-size:18px;
}

.start-screen h1{
font-size:50px;
}

}

</style>

</head>

<body>

<div class="ui">

<div class="logo">
Rush Zone
</div>

<div class="score">
Score:
<span id="score">0</span>
</div>

</div>

<!-- START -->

<div class="start-screen"
id="startScreen">

<h1>Rush Zone</h1>

<p>Tap SPACE or Touch to Jump</p>

<button class="start-btn"
id="startBtn">

Start Game

</button>

</div>

<!-- GAME OVER -->

<div class="game-over"
id="gameOver">

<h2>Game Over</h2>

<button class="restart-btn"
id="restartBtn">

Restart

</button>

</div>

<!-- CANVAS -->

<canvas id="gameCanvas"></canvas>

<script>

const canvas =
document.getElementById(
'gameCanvas'
);

const ctx =
canvas.getContext('2d');

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

/* SCORE */

const scoreEl =
document.getElementById(
'score'
);

/* PLAYER */

const player = {

x:120,

y:canvas.height - 170,

width:60,
height:90,

velocityY:0,

gravity:1,

jump:-20,

grounded:true

};

/* GAME */

let obstacles = [];

let score = 0;

let speed = 8;

let gameRunning = false;

/* CREATE OBSTACLE */

function createObstacle(){

obstacles.push({

x:canvas.width,

y:canvas.height - 120,

width:45,
height:45

});

}

setInterval(()=>{

if(gameRunning){

createObstacle();

}

},1400);

/* PLAYER */

function drawPlayer(){

ctx.save();

ctx.shadowBlur = 25;
ctx.shadowColor = "#00d4ff";

/* HEAD */

ctx.fillStyle = "#00d4ff";

ctx.beginPath();

ctx.arc(
player.x + 30,
player.y + 20,
18,
0,
Math.PI * 2
);

ctx.fill();

/* BODY */

const bodyGradient =
ctx.createLinearGradient(
player.x,
player.y,
player.x + 60,
player.y + 90
);

bodyGradient.addColorStop(
0,
"#00d4ff"
);

bodyGradient.addColorStop(
1,
"#7c3aed"
);

ctx.fillStyle =
bodyGradient;

ctx.beginPath();

ctx.roundRect(
player.x + 16,
player.y + 38,
28,
34,
10
);

ctx.fill();

/* ARMS */

ctx.strokeStyle =
"#00d4ff";

ctx.lineWidth = 6;

ctx.beginPath();

ctx.moveTo(
player.x + 16,
player.y + 46
);

ctx.lineTo(
player.x + 2,
player.y + 58
);

ctx.moveTo(
player.x + 44,
player.y + 46
);

ctx.lineTo(
player.x + 58,
player.y + 58
);

ctx.stroke();

/* LEGS */

ctx.beginPath();

ctx.moveTo(
player.x + 24,
player.y + 72
);

ctx.lineTo(
player.x + 16,
player.y + 92
);

ctx.moveTo(
player.x + 36,
player.y + 72
);

ctx.lineTo(
player.x + 44,
player.y + 92
);

ctx.stroke();

/* EYES */

ctx.fillStyle =
"#ffffff";

ctx.beginPath();

ctx.arc(
player.x + 24,
player.y + 18,
2,
0,
Math.PI * 2
);

ctx.arc(
player.x + 36,
player.y + 18,
2,
0,
Math.PI * 2
);

ctx.fill();

ctx.restore();

}

/* OBSTACLES */

function drawObstacles(){

obstacles.forEach((obs,index)=>{

obs.x -= speed;

/* SPIKE */

ctx.save();

ctx.shadowBlur = 20;

ctx.shadowColor =
"#ff004c";

ctx.fillStyle =
"#ff004c";

ctx.beginPath();

ctx.moveTo(
obs.x,
obs.y + obs.height
);

ctx.lineTo(
obs.x + obs.width/2,
obs.y
);

ctx.lineTo(
obs.x + obs.width,
obs.y + obs.height
);

ctx.closePath();

ctx.fill();

ctx.restore();

/* REMOVE */

if(obs.x + obs.width < 0){

obstacles.splice(index,1);

score++;

scoreEl.innerText =
score;

}

/* COLLISION */

if(

player.x <
obs.x + obs.width &&

player.x + player.width >
obs.x &&

player.y <
obs.y + obs.height &&

player.y + player.height >
obs.y

){

gameOver();

}

});

}

/* UPDATE */

function update(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

/* BG */

ctx.fillStyle =
"#050816";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

/* GROUND */

ctx.fillStyle =
"#ff004c";

ctx.fillRect(
0,
canvas.height - 80,
canvas.width,
4
);

/* PHYSICS */

player.velocityY +=
player.gravity;

player.y +=
player.velocityY;

/* GROUND */

if(
player.y >=
canvas.height - 170
){

player.y =
canvas.height - 170;

player.grounded =
true;

}

/* DRAW */

drawPlayer();

drawObstacles();

/* LOOP */

if(gameRunning){

requestAnimationFrame(
update
);

}

}

/* JUMP */

function jump(){

if(player.grounded){

player.velocityY =
player.jump;

player.grounded =
false;

}

}

/* CONTROLS */

window.addEventListener(
'keydown',
(e)=>{

if(e.code === 'Space'){

jump();

}

}
);

window.addEventListener(
'touchstart',
()=>{

jump();

}
);

/* START */

function startGame(){

obstacles = [];

score = 0;

scoreEl.innerText = 0;

gameRunning = true;

document.getElementById(
'startScreen'
).style.display = 'none';

document.getElementById(
'gameOver'
).style.display = 'none';

update();

}

/* GAME OVER */

function gameOver(){

gameRunning = false;

document.getElementById(
'gameOver'
).style.display = 'flex';

}

/* BUTTONS */

document.getElementById(
'startBtn'
).onclick = startGame;

document.getElementById(
'restartBtn'
).onclick = startGame;

/* RESIZE */

window.addEventListener(
'resize',
()=>{

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}
);

</script>

</body>
</html>
